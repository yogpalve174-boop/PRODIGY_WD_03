<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PRODIGY_WD_03 - Tic Tac Toe</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      text-align: center;
    }

    h1 {
      margin-bottom: 15px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      gap: 8px;
      margin: 20px auto;
    }

    .cell {
      width: 100px;
      height: 100px;
      background: #1e293b;
      font-size: 2.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      border-radius: 8px;
    }

    .cell:hover {
      background: #334155;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      background: #22c55e;
      color: black;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #16a34a;
    }

    .status {
      margin-top: 10px;
      font-size: 18px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Tic Tac Toe</h1>

    <div class="board" id="board">
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
      <div class="cell"></div>
    </div>

    <div class="status" id="status">Player X's turn</div>
    <br>
    <button onclick="restartGame()">Restart Game</button>
  </div>

  <script>
    const cells = document.querySelectorAll(".cell");
    const statusText = document.getElementById("status");
    let currentPlayer = "X";
    let gameActive = true;
    let board = ["", "", "", "", "", "", "", "", ""];

    const winPatterns = [
      [0,1,2], [3,4,5], [6,7,8],
      [0,3,6], [1,4,7], [2,5,8],
      [0,4,8], [2,4,6]
    ];

    cells.forEach((cell, index) => {
      cell.addEventListener("click", () => handleCellClick(index));
    });

    function handleCellClick(index) {
      if (!gameActive || board[index] !== "") return;

      board[index] = currentPlayer;
      cells[index].textContent = currentPlayer;

      if (checkWin()) {
        statusText.textContent = `Player ${currentPlayer} wins!`;
        gameActive = false;
      } else if (!board.includes("")) {
        statusText.textContent = "It's a draw!";
        gameActive = false;
      } else {
        currentPlayer = currentPlayer === "X" ? "O" : "X";
        statusText.textContent = `Player ${currentPlayer}'s turn`;
      }
    }

    function checkWin() {
      return winPatterns.some(pattern => {
        return pattern.every(index => board[index] === currentPlayer);
      });
    }

    function restartGame() {
      board = ["", "", "", "", "", "", "", "", ""];
      cells.forEach(cell => cell.textContent = "");
      currentPlayer = "X";
      gameActive = true;
      statusText.textContent = "Player X's turn";
    }
  </script>
</body>
</html>
