<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tic Tac Toe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        .game {
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        h1 {
            margin-bottom: 10px;
        }

        #status {
            margin: 10px 0;
            font-size: 18px;
            font-weight: bold;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 8px;
            margin: 15px auto;
        }

        .cell {
            width: 100px;
            height: 100px;
            background: #e0e0e0;
            font-size: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border-radius: 5px;
            user-select: none;
        }

        .cell:hover {
            background: #d0d0d0;
        }

        button {
            padding: 8px 16px;
            border: none;
            background: #2196f3;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #1976d2;
        }
    </style>
</head>
<body>

<div class="game">
    <h1>Tic Tac Toe</h1>
    <div id="status">Player X's Turn</div>

    <div class="board">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
    </div>

    <button onclick="resetGame()">Restart</button>
</div>

<script>
    const cells = document.querySelectorAll(".cell");
    const statusText = document.getElementById("status");

    let currentPlayer = "X";
    let gameOver = false;

    const winPatterns = [
        [0,1,2], [3,4,5], [6,7,8],
        [0,3,6], [1,4,7], [2,5,8],
        [0,4,8], [2,4,6]
    ];

    cells.forEach((cell, index) => {
        cell.addEventListener("click", () => {
            if (cell.textContent !== "" || gameOver) return;

            cell.textContent = currentPlayer;

            if (checkWin()) {
                statusText.textContent = `Player ${currentPlayer} Wins!`;
                gameOver = true;
                return;
            }

            if (checkDraw()) {
                statusText.textContent = "Game Draw!";
                gameOver = true;
                return;
            }

            currentPlayer = currentPlayer === "X" ? "O" : "X";
            statusText.textContent = `Player ${currentPlayer}'s Turn`;
        });
    });

    function checkWin() {
        return winPatterns.some(pattern =>
            pattern.every(index => cells[index].textContent === currentPlayer)
        );
    }

    function checkDraw() {
        return [...cells].every(cell => cell.textContent !== "");
    }

    function resetGame() {
        cells.forEach(cell => cell.textContent = "");
        currentPlayer = "X";
        gameOver = false;
        statusText.textContent = "Player X's Turn";
    }
</script>
